# Build iOS IPA on GitHub macOS runner (unsigned by default — user re-signs locally).
# Local: place zip in Xcode-Input/ -> double-click run.bat

name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "Xcode-Input/**"
      - "tool/build-config.json"
      - "scripts/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:
    inputs:
      signed_build:
        description: Sign with p12 secrets (optional)
        type: boolean
        default: false
      upload_appstore:
        description: Upload to App Store Connect (requires signed build)
        type: boolean
        default: false

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Load build config
        run: bash scripts/load-build-config.sh tool/build-config.json

      - name: Extract Xcode project
        run: |
          mkdir -p Xcode-Input/extracted
          ZIP_PATH=""
          if [ -n "${XCODE_ZIP_URL:-}" ]; then
            echo "Downloading Xcode zip from $XCODE_ZIP_URL ..."
            curl -fL --retry 5 --retry-delay 3 -o Xcode-Input/from-url.zip "$XCODE_ZIP_URL"
            ZIP_PATH="Xcode-Input/from-url.zip"
          elif [ ! -d "$XCODE_SRC/$XCODE_PROJECT" ]; then
            echo "Extracting $XCODE_ZIP ..."
            ZIP_PATH="$XCODE_ZIP"
          else
            echo "Xcode source already present at $XCODE_SRC"
          fi
          if [ -n "$ZIP_PATH" ]; then
            # Normalize Windows backslash zip entries (Info-ZIP leaves them as literal '\').
            python3 - "$ZIP_PATH" Xcode-Input/extracted <<'PY'
import os, sys, zipfile
zip_path, dest = sys.argv[1], sys.argv[2]
os.makedirs(dest, exist_ok=True)
with zipfile.ZipFile(zip_path) as zf:
    for info in zf.infolist():
        name = info.filename.replace("\\", "/")
        if not name or name.endswith("/"):
            continue
        out = os.path.join(dest, name)
        os.makedirs(os.path.dirname(out), exist_ok=True)
        with zf.open(info) as src, open(out, "wb") as dst:
            dst.write(src.read())
print("extracted ok")
PY
          fi
          # Resolve project dir even if zip had an outer folder
          FOUND=$(find Xcode-Input/extracted -type d -name "$XCODE_PROJECT" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "Xcode project not found under Xcode-Input/extracted"; find Xcode-Input/extracted -maxdepth 3 -type d | head -40; exit 1
          fi
          SRC_DIR=$(dirname "$FOUND")
          echo "XCODE_SRC=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Resolved XCODE_SRC=$SRC_DIR (project=$FOUND)"
          test -d "$SRC_DIR/$XCODE_PROJECT"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install signing assets (optional)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNED_BUILD_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_build || 'false' }}
        run: |
          if [ "$SIGNED_BUILD_INPUT" = "true" ] && [ -n "${BUILD_CERTIFICATE_BASE64}" ]; then
            bash scripts/setup-signing.sh
            echo "UNSIGNED_BUILD=0" >> "$GITHUB_ENV"
            echo "Signed build enabled."
          else
            echo "UNSIGNED_BUILD=1" >> "$GITHUB_ENV"
            echo "Unsigned build — IPA for user re-signing (no p12 required)."
          fi

      - name: Build and pack IPA (Payload)
        working-directory: ${{ env.XCODE_SRC }}
        env:
          XCODE_PROJECT: ${{ env.XCODE_PROJECT }}
          SCHEME: ${{ env.SCHEME }}
          APP_NAME: ${{ env.APP_NAME }}
          UNSIGNED_BUILD: ${{ env.UNSIGNED_BUILD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          OUTPUT_IPA: ${{ github.workspace }}/${{ env.OUTPUT_IPA }}
        run: bash "${{ github.workspace }}/scripts/build-and-pack-ipa-payload.sh"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_IPA }}
          retention-days: 14

      - name: Upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.upload_appstore == true && inputs.signed_build == true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IPA_FILE: ${{ github.workspace }}/${{ env.OUTPUT_IPA }}
        run: bash scripts/upload-appstore.sh
